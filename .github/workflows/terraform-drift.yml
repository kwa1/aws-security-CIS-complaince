name: Terraform Drift Detection

on:
  schedule:
    - cron: "0 2 * * *"  # nightly
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform Init
        run: terraform -chdir=terraform/environments/prod-account init

      - name: Detect Drift
        run: terraform -chdir=terraform/environments/prod-account plan -detailed-exitcode
