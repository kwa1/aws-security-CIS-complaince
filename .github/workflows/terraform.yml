name: Terraform (plan / apply)

# Reusable workflow. Authenticates to AWS with GitHub OIDC (no stored AWS keys).
#   plan : read-only role, runs for pull requests, OPA gate over the plan JSON.
#   apply: separate role bound to a protected GitHub Environment (required reviewers),
#          applies the exact plan file that was reviewed.
on:
  workflow_call:
    inputs:
      stack:
        description: Directory under environments/ (security-account | member-account)
        type: string
        required: true
      tfvars:
        description: Path to the tfvars file for this target
        type: string
        required: true
      backend_config:
        description: Path to the backend config file for this target
        type: string
        required: true
      aws_region:
        description: Region used for the OIDC session
        type: string
        required: true
      github_environment:
        description: GitHub Environment (required reviewers) that gates apply
        type: string
        required: true
      plan_role_arn:
        description: Read-only OIDC role ARN used for plan (bootstrap output plan_role_arn)
        type: string
        required: true
      apply_role_arn:
        description: Gated OIDC role ARN used for apply (bootstrap output apply_role_arn)
        type: string
        default: ""
      apply:
        description: Run the apply job after plan
        type: boolean
        default: false

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  plan:
    name: Plan ${{ inputs.stack }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check target configuration exists
        env:
          TFVARS: ${{ inputs.tfvars }}
          BACKEND_CONFIG: ${{ inputs.backend_config }}
        run: |
          for f in "$TFVARS" "$BACKEND_CONFIG"; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing $f - copy the matching *.example file, fill in real values and commit it (see docs/DEPLOYMENT.md)."
              exit 1
            fi
          done

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false

      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: 1.23.0

      - uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5 # v6.3.1
        with:
          role-to-assume: ${{ inputs.plan_role_arn }}
          aws-region: ${{ inputs.aws_region }}
          role-session-name: gh-plan-${{ github.run_id }}
          role-duration-seconds: 3600

      - name: Init
        working-directory: environments/${{ inputs.stack }}
        env:
          BACKEND_CONFIG: ${{ github.workspace }}/${{ inputs.backend_config }}
        run: terraform init -backend-config="$BACKEND_CONFIG"

      - name: Plan
        working-directory: environments/${{ inputs.stack }}
        env:
          TFVARS: ${{ github.workspace }}/${{ inputs.tfvars }}
        run: |
          set -euo pipefail
          terraform plan -var-file="$TFVARS" -lock-timeout=5m -out=tfplan
          terraform show -json tfplan > plan.json

      - name: OPA policy gate
        id: opa
        working-directory: environments/${{ inputs.stack }}
        run: |
          set -euo pipefail
          opa eval --v1-compatible --format raw --data "$GITHUB_WORKSPACE/opa/policies" \
            --input plan.json 'data.terraform.aws' \
            | python3 -c '
          import json, sys
          doc = json.load(sys.stdin)
          violations = sorted(m for pkg in doc.values() if isinstance(pkg, dict) for m in pkg.get("deny", []))
          for v in violations:
              print(f"::error::{v}")
          open("violations.txt", "w").write("\n".join(violations))
          sys.exit(1 if violations else 0)
          '

      - name: Summarize plan
        if: always()
        working-directory: environments/${{ inputs.stack }}
        run: |
          {
            echo "### Terraform plan: ${{ inputs.stack }} (${{ inputs.aws_region }})"
            echo '```'
            terraform show -no-color tfplan 2>/dev/null | tail -n 60 || true
            echo '```'
            if [ -s violations.txt ]; then
              echo "#### Policy violations"
              sed 's/^/- /' violations.txt
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan
        if: inputs.apply
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan-${{ inputs.stack }}-${{ inputs.aws_region }}-${{ github.run_id }}
          path: environments/${{ inputs.stack }}/tfplan
          retention-days: 3
          if-no-files-found: error

  apply:
    name: Apply ${{ inputs.stack }}
    if: inputs.apply
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.github_environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5 # v6.3.1
        with:
          role-to-assume: ${{ inputs.apply_role_arn }}
          aws-region: ${{ inputs.aws_region }}
          role-session-name: gh-apply-${{ github.run_id }}
          role-duration-seconds: 3600

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan-${{ inputs.stack }}-${{ inputs.aws_region }}-${{ github.run_id }}
          path: environments/${{ inputs.stack }}

      - name: Init
        working-directory: environments/${{ inputs.stack }}
        env:
          BACKEND_CONFIG: ${{ github.workspace }}/${{ inputs.backend_config }}
        run: terraform init -backend-config="$BACKEND_CONFIG"

      - name: Apply reviewed plan
        working-directory: environments/${{ inputs.stack }}
        run: terraform apply -lock-timeout=10m tfplan
